<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page connexion</title>
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body>
    <header>
      <a href="#" class="logo-block">
        <div class="logo-square">G</div>
        <span class="logo-text">Green Goodies</span>
      </a>
      <nav>
        <ul>
          <li><a href="#">Nos produits</a></li>
          <li><a href="#">Mon panier</a></li>
          <li><a href="#">Mon compte</a></li>
          <li><a href="#">Déconnexion</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="cnx-reg-sec">
        <img class="img-cnx" src="../img/cnx-1.png" alt="" />
        <div class="div-form">
          <h1>Connexion</h1>
          <form action="#" method="POST">
            <div class="champ-formulaire">
              <label for="email">Adresse email</label>
              <input type="text" name="email" id="email" placeholder="nom@exemple.com"/>
            </div>
            <div class="champ-formulaire">
              <label for="password">Mot de passe</label>
              <input type="password" name="password" id="password"/>
            </div>
            <button class="btn-form">Se connecter</button>
          </form>
          <a href="#">Pas encore de compte ? S'inscrire</a>
      </section>
    </main>

    <!-- Pied de page -->
    <footer>
      <p>&copy; GreenGoodies - 2026</p>
    </footer>
  </body>
</html>
