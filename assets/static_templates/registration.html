<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Page d'inscription</title>
        <link rel="stylesheet" href="../styles/style.css" />
    </head>
    <body>
        <header>
            <a href="#" class="logo-block">
                <div class="logo-square">G</div>
                <span class="logo-text">Green Goodies</span>
            </a>
            <nav>
                <ul>
                    <li><a href="#">Nos produits</a></li>
                    <li><a href="#">Mon panier</a></li>
                    <li><a href="#">Mon compte</a></li>
                    <li><a href="#">Déconnexion</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="cnx-reg-sec">
                <img class="img-cnx" src="../img/reg-1.png" alt="" />
                <div class="div-form">
                    <h1>Inscription</h1>
                    <p>Tous les champs sont obligatoires</p>
                    <form action="#" method="POST">
                        <div class="champ-formulaire">
                            <label for="nom">Nom</label>
                            <input type="text" name="nom" id="nom" />
                        </div>
                        <div class="champ-formulaire">
                            <label for="prenom">Prénom</label>
                            <input type="text" name="prenom" id="prenom" />
                        </div>
                        <div class="champ-formulaire">
                            <label for="email">Adresse email</label>
                            <input
                                type="text"
                                name="email"
                                id="email"
                                placeholder="nom@exemple.com"
                            />
                        </div>
                        <div class="champ-formulaire">
                            <label for="password">Mot de passe</label>
                            <input
                                type="password"
                                name="password"
                                id="password"
                            />
                        </div>
                        <div class="champ-formulaire">
                            <label for="password2"
                                >Confirmation mot de passe</label
                            >
                            <input
                                type="password2"
                                name="password2"
                                id="password2"
                            />
                        </div>
                        <div class="checkbox-formulaire">
                            <input
                                type="checkbox"
                                id="cgu"
                                name="cgu"
                                required
                            />
                            <label for="cgu"
                                >J'accepte les CGU de GreenGoodies</label
                            >
                        </div>

                        <button class="btn-form btn-registration">
                            S'inscrire
                        </button>
                    </form>
                    <a href="#">Déjà un compte ? Se connecter</a>
                </div>
            </section>
        </main>

        <!-- Pied de page -->
        <footer>
            <p>&copy; GreenGoodies - 2026</p>
        </footer>
    </body>
</html>
